name: ci
on: [push, pull_request]
jobs:
  hashchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: hash-chain regression tests
        run: cd examples/hashchain && python3 test_hashchain.py
      - name: verify shipped sample timeline
        run: cd examples/hashchain && python3 lifeos_hashchain.py verify ../vault/sample_timeline.jsonl
